# For writing new migrations only. The app applies them itself on start.
# Point THIS_IS_YOU_DATA_DIR at a scratch directory first, so a new revision is never
# generated against your real archive:
#   THIS_IS_YOU_DATA_DIR=/tmp/tiy-dev .venv/bin/alembic revision --autogenerate -m "describe change"
[alembic]
script_location = this_is_you/migrations
file_template = %%(rev)s_%%(slug)s
