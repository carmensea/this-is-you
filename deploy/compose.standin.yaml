# TEST ONLY. Replaces Tailscale with a local HTTPS proxy in the same position, for a machine with no tailnet.
# It proves the deployment around the proxy, and it is not a substitute for testing real `tailscale serve`.
#   docker compose -f compose.yaml -f deploy/compose.standin.yaml up
services:
  proxy:
    image: caddy@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    user: !reset null
    cap_add: [NET_BIND_SERVICE] # Only because this image's binary is marked with it. Tailscale needs none.
    environment: !reset {}
    secrets: !reset []
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    volumes: !override
      - ./deploy/Caddyfile.standin:/etc/caddy/Caddyfile:ro
    tmpfs: !override
      - /data:size=16m
      - /config:size=4m
      - /tmp:size=8m
  net:
    ports: ["127.0.0.1:8443:8443"]
  app:
    environment:
      THIS_IS_YOU_MAX_UPLOAD_BYTES: "5242880" # The messy test folder has one file just over this.
secrets: !reset {}
